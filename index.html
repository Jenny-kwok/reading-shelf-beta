<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F3F0EA" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Reading Shelf" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
  <title>Reading Shelf</title>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">PRIVATE LIBRARY</div>
        <h1>Reading Shelf</h1>
      </div>
      <button class="circle" id="addBtn" aria-label="Add book">＋</button>
    </header>

    <section>
      <div class="sectionHead"><h2>Currently Reading</h2><span id="readingCount"></span></div>
      <div class="rail" id="readingRail"></div>
    </section>

    <section>
      <div class="sectionHead"><h2>Up Next</h2><span id="nextCount"></span></div>
      <div class="rail" id="nextRail"></div>
    </section>

    <section class="library">
      <div class="sectionHead"><h2>The Shelf</h2><button class="textBtn" id="randomBtn">Wander</button></div>
      <input id="search" class="search" placeholder="Search books, authors, notes, ideas…" />
      <div class="grid" id="libraryGrid"></div>
    </section>

    <nav class="bottom">
      <button data-view="shelf" class="active">Shelf</button>
      <button data-view="journey">Journey</button>
      <button data-view="ideas">Ideas</button>
      <button data-view="settings">•••</button>
    </nav>
  </main>

  <dialog id="bookDialog">
    <form method="dialog" class="sheet" id="bookForm">
      <button class="close" value="cancel">×</button>
      <div id="dialogBody"></div>
    </form>
  </dialog>

  <dialog id="addDialog">
    <div class="sheet">
      <button class="close" id="closeAdd">×</button>
      <div class="eyebrow">ADD A BOOK</div>
      <h2>Start with the book itself.</h2>
      <p class="muted">For V0: choose a cover photo from your iPhone. We keep the image and let you confirm the metadata rather than inventing it.</p>
      <label class="photoPick">📷 Choose / take cover photo<input id="coverInput" type="file" accept="image/*" capture="environment"></label>
      <img id="preview" class="preview hidden" alt="Cover preview"/>
      <label>Title <input id="titleInput" placeholder="Optional until matched"/></label>
      <label>Author <input id="authorInput" placeholder="Optional"/></label>
      <label>Status
        <select id="statusInput"><option value="upnext">Up Next</option><option value="reading">Currently Reading</option><option value="shelf">To Read</option></select>
      </label>
      <details>
        <summary>Provenance — optional</summary>
        <label>How it came to me
          <select id="sourceType"><option value="">Unknown / not recorded</option><option>Bought</option><option>Gift</option><option>Borrowed</option><option>Other</option></select>
        </label>
        <label>Where / from whom <input id="sourcePlace" placeholder="e.g. Daikanyama T-Site / a friend"/></label>
        <label>When — exact or approximate <input id="acquiredWhen" placeholder="e.g. 2026-10-03, Oct 2026, Spring 2024"/></label>
      </details>
      <button class="primary" id="saveBook" type="button">Add to shelf</button>
    </div>
  </dialog>

  <dialog id="simpleDialog">
    <div class="sheet">
      <button class="close" id="closeSimple">×</button>
      <div id="simpleBody"></div>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
